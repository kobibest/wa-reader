<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>WA Reader</title>
<link rel="stylesheet" href="style.css">
<style>
  body { width: 320px; padding: 14px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .st { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 8px; }
  .st .k { font-size: 12px; color: var(--muted); }
  .st .v { font-weight: 600; }
  .actions { display: grid; gap: 6px; margin-top: 10px; }
  .actions button { width: 100%; }
</style>
</head>
<body>
  <header>
    <h2>WA Reader</h2>
    <span class="badge-ro">קריאה בלבד</span>
  </header>

  <div id="setup" style="display:none">
    <p class="small">התוסף עוד לא הופעל. הוא לא נוגע בווצאפ עד שתאשר.</p>
    <button class="primary" id="activate" style="width:100%">להפעלה</button>
  </div>

  <div id="main" style="display:none">
    <div class="st"><div class="k">WhatsApp Web</div><div class="v" id="wa"><span class="dot"></span>בודק…</div></div>
    <div class="st"><div class="k">כלי AI (MCP)</div><div class="v" id="ai"><span class="dot"></span>בודק…</div></div>
    <div class="small muted" id="last"></div>
    <div class="actions">
      <button class="primary" id="opts">חיבור לכלי AI והגדרות</button>
      <button id="openWa">פתח את WhatsApp Web</button>
    </div>
  </div>

  <div style="margin-top:12px" id="by"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
