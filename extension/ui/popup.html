<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>WA Reader</title>
<link rel="stylesheet" href="style.css">
<style>
  body { width: 320px; padding: 14px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 12px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .stat b { display: block; font-size: 20px; }
  .actions { display: grid; gap: 6px; }
  .actions button { width: 100%; }
  #msg { min-height: 18px; margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <h2>WA Reader</h2>
    <span class="badge-ro">קריאה בלבד</span>
  </header>
  <div id="conn" class="small"><span class="dot"></span>בודק…</div>
  <div class="stats">
    <div class="stat"><b id="today">–</b><span class="muted small">הודעות היום</span></div>
    <div class="stat"><b id="total">–</b><span class="muted small">שמורות מקומית</span></div>
  </div>
  <div class="small muted" id="last"></div>
  <div class="small muted" id="lock"></div>
  <div id="setup" style="display:none;margin-top:12px">
    <p class="small">התוסף עוד לא הופעל. הוא לא קורא כלום עד שתאשר.</p>
    <button class="primary" id="activate" style="width:100%">להפעלה</button>
  </div>
  <div class="actions" id="main" style="margin-top:12px">
    <button class="primary" id="open">פתח סיכום יומי</button>
    <button id="sync">סנכרן עכשיו</button>
    <button id="opts">הגדרות</button>
  </div>
  <div id="msg" class="small"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
