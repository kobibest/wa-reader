<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>WA Reader</title>
<link rel="stylesheet" href="style.css">
<style>
  body { width: 320px; padding: 14px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .lights { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px; margin-bottom: 8px; }
  .light { display: flex; align-items: center; gap: 2px; padding: 7px 0; }
  .light + .light { border-top: 1px solid var(--line); }
  .light .v { font-weight: 600; }
  .light .k { font-size: 12px; color: var(--muted); margin-inline-start: auto; }
  .actions { display: grid; gap: 6px; margin-top: 10px; }
  .actions button { width: 100%; }
</style>
</head>
<body>
  <header>
    <h2>WA Reader</h2>
    <span class="badge-ro">קריאה בלבד</span>
  </header>

  <div id="setup" style="display:none">
    <p class="small">התוסף עוד לא הופעל. הוא לא נוגע בווצאפ עד שתאשר.</p>
    <button class="primary" id="activate" style="width:100%">להפעלה</button>
  </div>

  <div id="main" style="display:none">
    <div class="lights">
      <div class="light"><span class="dot" id="d1"></span><span class="v">WhatsApp Web פתוח</span><span class="k" id="k1"></span></div>
      <div class="light"><span class="dot" id="d2"></span><span class="v">מחובר ל-Claude Desktop</span><span class="k" id="k2"></span></div>
      <div class="light"><span class="dot" id="d3"></span><span class="v">מוכן</span><span class="k" id="k3"></span></div>
    </div>
    <div class="small muted" id="hint"></div>
    <div class="actions">
      <button id="openWa">פתח את WhatsApp Web</button>
      <button id="opts">הגדרות</button>
    </div>
  </div>

  <div style="margin-top:12px" id="by"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
