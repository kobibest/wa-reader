name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: ./scripts/build-mcpb.sh
      - run: ./scripts/package.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          ev=$(node -p "require('./extension/manifest.json').version")
          tag="v$v"
          notes="WA Reader $v – local-only bridge between WhatsApp Web and Claude Desktop.

          Install: 1) WA Reader from the Chrome Web Store. 2) Claude Desktop → Settings → Desktop app → Extensions → Advanced settings → Install Extension… → choose wa-reader.mcpb (Claude Desktop only, regular Chat).
          No server, no telemetry, read-only, messages are not stored. Files and voice messages are handed over only when Claude asks for one: images and recordings go to Claude as they are, documents are saved in Downloads/WA Reader.

          Files: wa-reader.mcpb = Claude Desktop extension · wa-reader-$ev.zip = Chrome Web Store upload · wa-reader-test-$ev.zip = test build (unzip → chrome://extensions → Load unpacked; works with the .mcpb with no settings)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/wa-reader.mcpb "dist/wa-reader-$ev.zip" "dist/wa-reader-test-$ev.zip" --clobber
          else
            gh release create "$tag" dist/wa-reader.mcpb "dist/wa-reader-$ev.zip" "dist/wa-reader-test-$ev.zip" --target "$GITHUB_SHA" --title "WA Reader $v" --notes "$notes" --latest
          fi
