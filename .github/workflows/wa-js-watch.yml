name: WA-JS watch

# Once a day: if a newer WA-JS is published on npm than the one bundled in the extension,
# open a DRAFT pull request with the new bundle. Nothing is merged or released automatically.
# The PR is the alert: GitHub notifies the repository owner when it is opened.

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compare bundled and latest WA-JS
        id: versions
        run: |
          bundled=$(grep -o 'wa-js v[0-9][0-9.]*' extension/page/wppconnect-wa.js | head -1 | sed 's/wa-js v//')
          latest=$(npm view @wppconnect/wa-js version)
          echo "bundled=$bundled latest=$latest"
          echo "bundled=$bundled" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Skip if up to date or a PR already exists
        id: gate
        if: steps.versions.outputs.bundled != steps.versions.outputs.latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="auto/wa-js-${{ steps.versions.outputs.latest }}"
          if gh pr list --head "$branch" --state all --json number --jq '.[].number' | grep -q .; then
            echo "PR for $branch already exists – skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the bundle
        if: steps.gate.outputs.run == 'true'
        run: ./scripts/update-wa-js.sh

      - name: Test
        if: steps.gate.outputs.run == 'true'
        run: |
          npm ci
          npm test
          ./scripts/build-mcpb.sh

      - name: Open draft PR
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.gate.outputs.branch }}
          BUNDLED: ${{ steps.versions.outputs.bundled }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add extension/page/wppconnect-wa.js extension/page/WA-JS-LICENSE.txt
          git commit -m "WA-JS $BUNDLED -> $LATEST (automatic watch)"
          git push -u origin "$BRANCH"
          body=$(cat <<EOF
          Automatic PR: a newer WA-JS ($LATEST) is on npm, the extension bundles $BUNDLED.

          **Before merging, test it by hand** (the automated checks cannot log in to WhatsApp):
          1. Build the test zip, load it unpacked in Chrome, and open web.whatsapp.com.
          2. Check that the popup shows the three green lights and that Claude can list chats and read a chat.
          3. Only then bump the version in package.json, extension/manifest.json, mcp/config.js, mcpb/manifest.json and store/LISTING.md, and merge.

          npm test and the .mcpb build passed in CI.

          ---
          Generated by Claude Code (https://claude.ai/code)
          EOF
          )
          gh pr create --draft --base main --head "$BRANCH" \
            --title "WA-JS $BUNDLED -> $LATEST" --body "$body"
